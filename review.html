  .review-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#page-selector{font:inherit;font-size:12px;color:#60758f;background:#fff;border:1px solid #e0e7f1;border-radius:6px;padding:10px 30px 10px 12px;min-width:180px;max-width:260px}.toolbar{flex-wrap:wrap}.tabs button{padding:7px 13px}#page-selector:focus-visible{outline:3px solid #9ab4fa;outline-offset:3px}</style>

<body>
  <header><div><span class="eyebrow">LAIDANLA · DESIGN REFINEMENT</span><h1>来单啦，全页面精修。</h1><p>20 个 PC 页面已统一精修。选择页面查看实际运行截图，原版项目独立保留。</p></div><span class="safe">✓ 原版文件校验通过</span></header>
  <main>
    <div class="toolbar">
      <div class="review-controls"><select id="page-selector" aria-label="选择对比页面"><option value="0">首页</option><option value="1">任务广场</option><option value="2">任务详情</option><option value="3">登录与身份选择</option><option value="4">发布任务-选择模板</option><option value="5">发布任务-填写需求</option><option value="6">发布任务-托管赏金</option><option value="7">商家工作台</option><option value="8">商家任务管理</option><option value="9">投标管理</option><option value="10">作品验收</option><option value="11">创作者订单</option><option value="12">订单详情与交付</option><option value="13">创作者钱包</option><option value="14">商家财务管理</option><option value="15">消息中心</option><option value="16">个人中心</option><option value="17">身份认证</option><option value="18">提交投标</option><option value="19">我的投标</option></select><div class="tabs" role="tablist" aria-label="选择对比页面"><button role="tab" aria-selected="true" data-page="login">登录页</button><button role="tab" aria-selected="false" data-page="dashboard">商家工作台</button></div></div>
      <div class="links"><a id="original-link" href="http://127.0.0.1:5173/login" target="_blank" rel="noopener">打开原版 ↗</a><a href="./preview.html">副本页面目录</a><a id="refined-link" class="primary" href="%BASE_URL%login">进入精修页面 ↗</a></div>
    </div>
    <div class="compare">
      <section class="version"><div class="version-heading"><strong>原版</strong><span>保留未改动 · 5173</span></div><img id="original-shot" class="screen" src="./assets/refined-review/original-login.webp" alt="原版登录页实际截图"><div class="caption"><span>原有布局与素材</span><span>独立保留</span></div></section>
      <section class="version refined"><div class="version-heading"><strong>精修副本</strong><span>本轮设计 · 5174</span></div><img id="refined-shot" class="screen" src="./assets/refined-review/refined-login.webp" alt="精修登录页实际截图"><div id="details" class="caption"><span>轻量导航</span><span>表单层级</span><span>高清银色流体</span><span>统一控件</span></div></section>
    </div>
  </main>
  <footer>截图来自实际运行页面。副本使用独立目录、预览端口和示例数据，原版项目未被覆盖。</footer>
  <script>
    const hosted = '%MODE%' === 'pages';
    const originalLink = document.getElementById('original-link');
    originalLink.hidden = hosted;
    const refinedBase = '%BASE_URL%' + (hosted ? '#/' : '');
    const pages=[{"label": "首页", "route": "/"}, {"label": "任务广场", "route": "/tasks"}, {"label": "任务详情", "route": "/tasks/square-1"}, {"label": "登录与身份选择", "route": "/login"}, {"label": "发布任务-选择模板", "route": "/publish/template"}, {"label": "发布任务-填写需求", "route": "/publish/requirements"}, {"label": "发布任务-托管赏金", "route": "/publish/payment"}, {"label": "商家工作台", "route": "/merchant"}, {"label": "商家任务管理", "route": "/merchant/tasks"}, {"label": "投标管理", "route": "/merchant/bids"}, {"label": "作品验收", "route": "/merchant/review/OD20261118002"}, {"label": "创作者订单", "route": "/creator/orders"}, {"label": "订单详情与交付", "route": "/creator/orders/OD20261118001"}, {"label": "创作者钱包", "route": "/creator/wallet"}, {"label": "商家财务管理", "route": "/merchant/finance"}, {"label": "消息中心", "route": "/messages"}, {"label": "个人中心", "route": "/profile"}, {"label": "身份认证", "route": "/verification?tab=business"}, {"label": "提交投标", "route": "/tasks/square-8/bid"}, {"label": "我的投标", "route": "/creator/bids"}];
    const details={0:['钴蓝与银色流体','统一任务卡片','分类与搜索','更清晰的赏金层级'],1:['轻量筛选','统一任务卡片','分页与空状态'],2:['任务摘要','交付要求','商家与接单信息'],3:['轻量导航','表单层级','高清银色流体'],4:['模板选择','清晰指导价','统一选中态'],5:['分组表单','附件上传','账单摘要'],6:['需求复核','费用明细','托管流程'],7:['紧凑侧栏','数据与待办层级','趋势切换'],8:['任务状态','筛选与表格密度','操作层级'],9:['方案对比','报价与工期','作品预览'],10:['版本切换','交付预览','验收操作'],11:['订单进度','交付时间','收益层级'],12:['版本记录','文件提交','需求速览'],13:['余额层级','资金流水','提现表单'],14:['资金统计','账单查询','充值与开票入口'],15:['连续会话布局','消息与编辑器','关联订单'],16:['创作者档案','作品集','认证与快捷入口'],17:['认证步骤','表单与凭证','状态反馈'],18:['投标表单','方案与附件','收益预估'],19:['投标状态','记录与空状态','任务入口']};
    function selectPage(index){
      const item=pages[index];if(!item)return;const key=String(index).padStart(2,'0');
      document.getElementById('page-selector').value=String(index);
      document.querySelectorAll('[data-page]').forEach(button=>button.setAttribute('aria-selected',String(index===(button.dataset.page==='login'?3:7))));
      for(const prefix of ['original','refined']){const image=document.getElementById(prefix+'-shot');image.src='./assets/refined-review/'+prefix+'-'+key+'.webp';image.alt=(prefix==='original'?'原版':'精修')+item.label+'实际截图'}
      if (!hosted) originalLink.href='http://127.0.0.1:5173'+item.route;
      document.getElementById('refined-link').href=refinedBase+item.route.slice(1);
      document.getElementById('details').replaceChildren(...details[index].map(text=>{const tag=document.createElement('span');tag.textContent=text;return tag}));
    }
    document.getElementById('page-selector').addEventListener('change',event=>selectPage(Number(event.target.value)));
    document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>selectPage(button.dataset.page==='login'?3:7)));
    selectPage(0);
  </script>
</body>
